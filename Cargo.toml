[package]
name = "cadstrike"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
native-ui = ["dep:eframe", "dep:rfd", "dep:png"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
eframe = { version = "0.30", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "glow"], optional = true }
rfd = { version = "0.15", optional = true }
png = { version = "0.18", optional = true }

[[bin]]
name = "cadstrike-ui"
path = "src/bin/cadstrike-ui.rs"
required-features = ["native-ui"]

[[bin]]
name = "cadstrike-capture"
path = "src/bin/cadstrike-capture.rs"
required-features = ["native-ui"]

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
