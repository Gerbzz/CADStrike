name: CADStrike grid overflow regression

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/upstream-grid-overflow.yml
      - foundation/crates/ui-egui/src/canvas.rs

permissions:
  contents: read

jobs:
  regression:
    if: github.repository == 'Gerbzz/CADStrike'
    runs-on: windows-latest
    timeout-minutes: 50
    defaults:
      run:
        shell: pwsh
        working-directory: foundation
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Record exact source
        run: git rev-parse HEAD
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.96.1'
      - name: Run upstream regression
        run: cargo test --locked -p cadcraft-ui-egui --lib grid_overflow_tests::
      - name: Run adjacent regression suite 1
        run: cargo test --locked -p cadcraft-ui-egui --lib
      - name: Run adjacent regression suite 2
        run: cargo test --locked -p cadstrike-project --test legacy
